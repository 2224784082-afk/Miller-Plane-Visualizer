<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miller Plane Visualizer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="Miller plane visualizer"></main>

    <section class="topbar" aria-label="Controls">
      <div class="brand">
        <h1>Miller Plane Visualizer</h1>
        <div class="sub">单一 unit cell 内裁切显示；初始视角：x 朝向你，y 向右，z 向上。</div>
      </div>

      <div class="controls">
        <label>
          x / h
          <input id="hInput" type="number" step="1" value="1" />
        </label>
        <label>
          y / k
          <input id="kInput" type="number" step="1" value="1" />
        </label>
        <label>
          z / l
          <input id="lInput" type="number" step="1" value="1" />
        </label>
        <label>
          Unit cell
          <select id="cellSelect">
            <option value="cubic">Cubic</option>
            <option value="tetragonal">Tetragonal</option>
            <option value="orthorhombic">Orthorhombic</option>
            <option value="hexagonal">Hexagonal</option>
          </select>
        </label>
        <label>
          Plane color
          <input id="colorInput" type="color" value="#0071e3" />
        </label>
        <label>
          Opacity
          <input id="opacityInput" type="range" min="0.18" max="0.88" step="0.01" value="0.58" />
        </label>
      </div>

      <button id="resetButton" type="button" title="Reset view">Reset</button>
    </section>

    <aside class="axis-badge" aria-label="Axis legend">
      <strong id="planeReadout">(1 1 1)</strong>
      <div class="legend-row"><span class="swatch" style="background: #ff3b30"></span>x axis faces you</div>
      <div class="legend-row"><span class="swatch" style="background: #34c759"></span>y axis points right</div>
      <div class="legend-row"><span class="swatch" style="background: #007aff"></span>z axis points up</div>
    </aside>

    <div id="toast" class="toast" role="status"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
